<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Все вместе - Карта взаимопомощи</title>
<link rel="stylesheet" href="styles.css">
<!-- Добавьте тип загрузки как defer -->
 
<script src="https://api-maps.yandex.ru/2.1/?apikey=f1b67a21-0ce5-4416-857a-838e9778a629&lang=ru_RU" type="text/javascript"></script>
<script src="https://yastatic.net/suggest-geocoder/1.0/suggest-geocoder.js"></script>
</head>
<body>
<div class="app">
<!-- Шапка -->
<header class="header">
<div class="container">
<div class="logo">Все вместе ♥</div>
<nav class="nav">
<button class="nav-btn active" data-page="map">Карта помощи</button>
<button class="nav-btn" data-page="funds">Фонды</button>
<button class="nav-btn" data-page="about">О проекте</button>
</nav>
</div>
</header>

<!-- Основной контент -->
<main class="main">
<!-- Страница карты -->
<section id="map-page" class="page active">
<div class="container">
<div class="map-controls">
<button id="create-request-btn" class="btn-primary">➕ Создать заявку</button>
<div class="filters">
<select id="category-filter">
<option value="">Все категории</option>
<option value="food">🍎 Еда</option>
<option value="clothes">👕 Одежда</option>
<option value="medicine">💊 Лекарства</option>
</select>
<select id="urgency-filter">
<option value="">Любая срочность</option>
<option value="critical">📕 Очень срочно</option>
<option value="high">📙 Срочно</option>
</select>
</div>
</div>
<div class="map-container">
<div id="map" style="width: 100%; height: 500px;">
<p>Карта загружается...</p>
</div>
</div>
<div class="stats">
<span id="requests-count">Заявок: 0</span>
<button id="test-btn" class="btn-secondary">Тест кнопка</button>
</div>
</div>
</section>

<!-- Страница фондов -->
<section id="funds-page" class="page">
<div class="container">
<h1>Благотворительные фонды</h1>
<button id="add-fund-btn" class="btn-primary">Добавить фонд</button>
<div id="funds-list" class="funds-grid">
<!-- Фонды появятся здесь -->
</div>
</div>
</section>

<!-- Страница о проекте -->
<section id="about-page" class="page">
<div class="container">
<h1>О проекте</h1>
<p>Платформа для взаимопомощи между людьми.</p>
</div>
</section>
</main>
</div>

<!-- Модальное окно -->
<div id="modal" class="modal" style="display: none;">
<div class="modal-content">
<h3 id="modal-title">Заголовок</h3>
<div id="modal-body">Содержимое</div>
<button id="modal-close" class="btn-secondary">Закрыть</button>
</div>
</div>

<script src="app.js"></script>
</body>
</html>
