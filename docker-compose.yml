services:
  web:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src:ro
      - ./db.sqlite3:/app/db.sqlite3  # монтируем SQLite файл
      - ./media:/app/media
      - ./staticfiles:/app/staticfiles
    env_file:
      - .env
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn --bind 0.0.0.0:8000 charity_platform.wsgi:application"

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./src:/app/src:ro
      - ./staticfiles:/app/staticfiles
      - ./media:/app/media
    depends_on:
      - web