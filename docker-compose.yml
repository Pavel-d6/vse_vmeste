version: '3.8'

services:
  web:
    build: .
    container_name: charity_web
    volumes:
      - ./src:/app/src:ro
      - ./db.sqlite3:/app/db.sqlite3
      - ./media:/app/media
      - static_volume:/app/staticfiles
    env_file:
      - .env
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn --bind 0.0.0.0:8000 --workers 3 --timeout 60 charity_platform.wsgi:application"
    restart: unless-stopped
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    container_name: charity_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./src:/app/src:ro
      - static_volume:/app/staticfiles:ro
      - ./media:/app/media:ro
      # Раскомментируйте после получения SSL сертификата:
      # - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - web
    restart: unless-stopped
    networks:
      - app-network

volumes:
  static_volume:

networks:
  app-network:
    driver: bridge